# Render blueprint, TRIAL setup on the free plan.
# Free plan: no persistent disk, so the SQLite data (accounts, reports) is erased on every restart,
# redeploy, or when the free service sleeps after idle time. Use it for demonstrations only.
# For real use: change plan to "starter" and add a disk, then set DATA_DIR to its mount path:
#   disk: { name: portal-data, mountPath: /var/data, sizeGB: 1 }   and   DATA_DIR=/var/data
services:
  - type: web
    name: srm-easwari-rain-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: "true"
    startCommand: node --disable-warning=ExperimentalWarning server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
