# Render blueprint. Render can also run the portal against the same Supabase database.
# Set DATABASE_URL (Supabase pooler URI) in the Render dashboard. Without it the portal falls back to an
# embedded test database on the free plan's disk, which is erased on every restart.
services:
  - type: web
    name: srm-easwari-rain-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
