<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summary report | SRM Easwari Engineering College</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-rain="off">
<div id="site-header"></div>
<main hidden>
  <h1>Rainy season commute summary</h1>
  <p class="muted" id="meta"></p>
  <div class="row no-print">
    <div class="field"><label for="days">Period</label>
      <select id="days"><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30" selected>Last 30 days</option><option value="60">Last 60 days</option><option value="90">Last 90 days</option></select></div>
    <div class="field"><button class="btn" type="button" id="print">Print or save as PDF</button></div>
  </div>
  <div id="out"></div>
</main>
<div id="site-footer"></div>
<script src="/app.js"></script>
<script src="/rain.js"></script>
<script src="/page-print.js"></script>
</body>
</html>
